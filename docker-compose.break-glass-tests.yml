services:
  break_glass_tests:
    image: python:3.12-alpine
    container_name: vitrine_break_glass_tests
    working_dir: /src
    command: ["python", "-m", "unittest", "discover", "-s", "break-glass/tests", "-v"]
    volumes:
      - ./:/src:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: "no"
