services:
  vps_ops_plugin:
    build:
      context: .
      dockerfile: vps-ops-plugin/Dockerfile
    container_name: vitrine_vps_ops_plugin_hml
    restart: unless-stopped
    environment:
      OPS_API_URL: http://vitrine_ops_api_hml:8080
      OPS_BROKER_URL: http://host.docker.internal:8770
      OPS_BROKER_TOKEN: ${OPS_BROKER_TOKEN}
      OPS_REQUEST_TIMEOUT_MS: 120000
      HOST: 0.0.0.0
      PORT: 8181
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vitrine_net
    ports:
      - "127.0.0.1:18181:8181"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  vps_ops_query_bridge:
    build:
      context: .
      dockerfile: vps-ops-plugin/Dockerfile.bootstrap-tunnel
    container_name: vitrine_vps_ops_query_bridge
    restart: unless-stopped
    depends_on:
      vps_ops_plugin:
        condition: service_healthy
    environment:
      OPS_BROKER_TOKEN: ${OPS_BROKER_TOKEN}
    command:
      - /usr/local/bin/query-bridge.sh
    networks:
      - vitrine_net
    volumes:
      - /srv/projects/vitrine-vps-ops/repository/storage/app/factory/vps-ops:/bootstrap:rw

  vps_ops_bootstrap_tunnel:
    build:
      context: .
      dockerfile: vps-ops-plugin/Dockerfile.bootstrap-tunnel
    container_name: vitrine_vps_ops_bootstrap_tunnel
    restart: unless-stopped
    depends_on:
      vps_ops_plugin:
        condition: service_healthy
    environment:
      OPS_BROKER_TOKEN: ${OPS_BROKER_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - >-
        echo BOOTSTRAP_START > /bootstrap/tunnel.txt;
        curl -sS -i http://vitrine_ops_api_hml:8080/health > /bootstrap/ops-api.txt 2>&1 || true;
        curl -sS -H "Authorization: Bearer $${OPS_BROKER_TOKEN}" http://vitrine_ops_api_hml:8080/projects/tvsumare/git-inspect > /bootstrap/git-inspect.txt 2>&1 || true;
        curl -sS -i -H "Authorization: Bearer $${OPS_BROKER_TOKEN}" http://host.docker.internal:8770/tvsumare/health > /bootstrap/ops-broker.txt 2>&1 || true;
        cloudflared --version >> /bootstrap/tunnel.txt 2>&1;
        echo TUNNEL_START >> /bootstrap/tunnel.txt;
        cloudflared tunnel --no-autoupdate --loglevel info --url http://vps_ops_plugin:8181 >> /bootstrap/tunnel.txt 2>&1;
        echo TUNNEL_EXIT=$? >> /bootstrap/tunnel.txt;
        sleep 3600
    networks:
      - vitrine_net
    volumes:
      - /srv/projects/vitrine-vps-ops/repository/storage/app/factory/vps-ops:/bootstrap:rw

  vps_ops_tvsumare_runtime_inspector:
    image: docker:27-cli
    container_name: vitrine_vps_ops_tvsumare_runtime_inspector
    restart: "no"
    command:
      - sh
      - -lc
      - >-
        {
          echo 'TVSUMARE_RUNTIME_INSPECT=START';
          date -u '+AT=%Y-%m-%dT%H:%M:%SZ';
          echo '--- PS ---';
          docker ps -a --no-trunc --filter 'name=^/tvsumare_web$';
          echo '--- STATUS ---';
          docker inspect tvsumare_web --format 'ID={{.Id}} IMAGE={{.Image}} STATUS={{.State.Status}} HEALTH={{if .State.Health}}{{.State.Health.Status}}{{end}} PROJECT={{index .Config.Labels "com.docker.compose.project"}}';
          echo '--- NETWORKS ---';
          docker inspect tvsumare_web --format '{{json .NetworkSettings.Networks}}';
          echo '--- MOUNTS ---';
          docker inspect tvsumare_web --format '{{json .Mounts}}';
          echo 'TVSUMARE_RUNTIME_INSPECT=END';
        } > /bootstrap/runtime-container-inspect.txt 2>&1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/projects/vitrine-vps-ops/repository/storage/app/factory/vps-ops:/bootstrap:rw

  vps_ops_tvsumare_repository_builder:
    image: docker:27-cli
    container_name: vitrine_vps_ops_tvsumare_repository_builder
    restart: "no"
    working_dir: /srv/tvsumare/repository
    command:
      - sh
      - -lc
      - >-
        rm -f /bootstrap/tvsumare-repository-build.txt;
        echo 'TVSUMARE_REPOSITORY_BUILD=START' > /bootstrap/tvsumare-repository-build.txt;
        date -u '+AT=%Y-%m-%dT%H:%M:%SZ' >> /bootstrap/tvsumare-repository-build.txt;
        docker compose -p repository -f docker-compose.vps.yml build >> /bootstrap/tvsumare-repository-build.txt 2>&1;
        rc=$$?;
        echo "CANDIDATE_EXIT_CODE=$$rc" >> /bootstrap/tvsumare-repository-build.txt;
        if [ "$$rc" -eq 0 ]; then docker image inspect repository-web:latest --format 'CANDIDATE_IMAGE_ID={{.Id}}' >> /bootstrap/tvsumare-repository-build.txt 2>&1; fi;
        echo 'TVSUMARE_REPOSITORY_BUILD=END' >> /bootstrap/tvsumare-repository-build.txt;
        exit $$rc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/tvsumare/repository:/srv/tvsumare/repository:ro
      - /srv/projects/vitrine-vps-ops/repository/storage/app/factory/vps-ops:/bootstrap:rw

  vps_ops_tvsumare_runtime_rollback_builder:
    image: docker:27-cli
    container_name: vitrine_vps_ops_tvsumare_runtime_rollback_builder
    restart: "no"
    command:
      - sh
      - -lc
      - >-
        rm -f /bootstrap/tvsumare-runtime-rollback-build.txt /tmp/tvsumare-runtime-export.tar /tmp/tvsumare-runtime-clean.tar;
        docker rm -f tvsumare_rollback_sanitize >/dev/null 2>&1 || true;
        echo 'TVSUMARE_RUNTIME_ROLLBACK_BUILD=START' > /bootstrap/tvsumare-runtime-rollback-build.txt;
        date -u '+AT=%Y-%m-%dT%H:%M:%SZ' >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        status=$$(docker inspect -f '{{.State.Status}}' tvsumare_web 2>/dev/null || true);
        health=$$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' tvsumare_web 2>/dev/null || true);
        echo "SOURCE_STATUS=$$status" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        echo "SOURCE_HEALTH=$$health" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        if [ "$$status" != 'running' ] || [ "$$health" != 'healthy' ]; then echo 'ERROR=source_runtime_not_healthy' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 10; fi;
        docker export -o /tmp/tvsumare-runtime-export.tar tvsumare_web >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1;
        export_rc=$$?;
        echo "EXPORT_EXIT_CODE=$$export_rc" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        if [ "$$export_rc" -ne 0 ] || [ ! -s /tmp/tvsumare-runtime-export.tar ]; then echo 'ERROR=runtime_export_failed' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 11; fi;
        docker import --change 'ENTRYPOINT ["docker-php-entrypoint"]' --change 'CMD ["apache2-foreground"]' --change 'EXPOSE 80' /tmp/tvsumare-runtime-export.tar repository-web:rollback-runtime-raw >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1;
        import_rc=$$?;
        echo "IMPORT_EXIT_CODE=$$import_rc" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        if [ "$$import_rc" -ne 0 ]; then echo 'ERROR=runtime_import_failed' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 12; fi;
        env_json=$$(docker image inspect repository-web:rollback-runtime-raw --format '{{json .Config.Env}}' 2>/dev/null || true);
        echo "IMAGE_ENV=$$env_json" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        case "$$env_json" in *OPENAI_API_KEY*|*GEMINI_API_KEY*|*HEYGEN_API_KEY*|*YOUTUBE_CLIENT_SECRET*|*TVSUMARE_ADMIN_PASS_HASH*|*SITE_FACTORY_TOKEN*) echo 'ERROR=sensitive_env_found_in_rollback_image' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 13;; esac;
        env_paths=$$(docker run --rm --entrypoint sh repository-web:rollback-runtime-raw -lc 'find /var/www/html -maxdepth 3 -type f \( -name ".env" -o -name ".env.*" \) -print' 2>/dev/null || true);
        if [ -n "$$env_paths" ]; then echo 'BLOCKED_ENV_PATHS_START' >> /bootstrap/tvsumare-runtime-rollback-build.txt; printf '%s\n' "$$env_paths" >> /bootstrap/tvsumare-runtime-rollback-build.txt; echo 'BLOCKED_ENV_PATHS_END' >> /bootstrap/tvsumare-runtime-rollback-build.txt; echo 'ERROR=sensitive_file_found_in_snapshot' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 14; fi;
        backup_paths=$$(docker run --rm --entrypoint sh repository-web:rollback-runtime-raw -lc 'find /var/www/html -maxdepth 3 -type f \( -name "*.bak" -o -name "*.bak-*" -o -name "*.backup-*" \) -print' 2>/dev/null || true);
        if [ -n "$$backup_paths" ]; then echo 'SANITIZED_BACKUP_PATHS_START' >> /bootstrap/tvsumare-runtime-rollback-build.txt; printf '%s\n' "$$backup_paths" >> /bootstrap/tvsumare-runtime-rollback-build.txt; echo 'SANITIZED_BACKUP_PATHS_END' >> /bootstrap/tvsumare-runtime-rollback-build.txt; fi;
        docker create --name tvsumare_rollback_sanitize --entrypoint sh repository-web:rollback-runtime-raw -lc 'find /var/www/html -maxdepth 3 -type f \( -name "*.bak" -o -name "*.bak-*" -o -name "*.backup-*" \) -delete' >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1;
        create_rc=$$?;
        echo "SANITIZE_CREATE_EXIT_CODE=$$create_rc" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        if [ "$$create_rc" -ne 0 ]; then echo 'ERROR=rollback_sanitize_create_failed' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 15; fi;
        docker start -a tvsumare_rollback_sanitize >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1;
        sanitize_rc=$$?;
        echo "SANITIZE_EXIT_CODE=$$sanitize_rc" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        if [ "$$sanitize_rc" -ne 0 ]; then echo 'ERROR=rollback_sanitize_failed' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 16; fi;
        docker export -o /tmp/tvsumare-runtime-clean.tar tvsumare_rollback_sanitize >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1;
        clean_export_rc=$$?;
        echo "CLEAN_EXPORT_EXIT_CODE=$$clean_export_rc" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        docker rm tvsumare_rollback_sanitize >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1 || true;
        if [ "$$clean_export_rc" -ne 0 ] || [ ! -s /tmp/tvsumare-runtime-clean.tar ]; then echo 'ERROR=rollback_clean_export_failed' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 17; fi;
        docker import --change 'ENTRYPOINT ["docker-php-entrypoint"]' --change 'CMD ["apache2-foreground"]' --change 'EXPOSE 80' /tmp/tvsumare-runtime-clean.tar repository-web:rollback-runtime-snapshot >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1;
        clean_import_rc=$$?;
        echo "CLEAN_IMPORT_EXIT_CODE=$$clean_import_rc" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        if [ "$$clean_import_rc" -ne 0 ]; then echo 'ERROR=rollback_clean_import_failed' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 18; fi;
        remaining=$$(docker run --rm --entrypoint sh repository-web:rollback-runtime-snapshot -lc 'find /var/www/html -maxdepth 3 -type f \( -name ".env" -o -name ".env.*" -o -name "*.bak" -o -name "*.bak-*" -o -name "*.backup-*" \) -print' 2>/dev/null || true);
        if [ -n "$$remaining" ]; then echo 'ERROR=rollback_sanitization_incomplete' >> /bootstrap/tvsumare-runtime-rollback-build.txt; printf '%s\n' "$$remaining" >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 19; fi;
        lint_fail=0;
        for file in /var/www/html/admin/_menu.php /var/www/html/admin/radar-regional.php /var/www/html/admin/nova-noticia.php /var/www/html/admin/drafts.php /var/www/html/admin/boletim-ia.php /var/www/html/admin/reporter-ia.php /var/www/html/admin/distribuicao-social.php /var/www/html/admin/tvplay.php /var/www/html/includes/youtube_oauth.php; do docker run --rm --entrypoint php repository-web:rollback-runtime-snapshot -l $$file >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1 || lint_fail=$$((lint_fail+1)); done;
        echo "ROLLBACK_LINT_FAIL=$$lint_fail" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        if [ "$$lint_fail" -ne 0 ]; then echo 'ERROR=rollback_lint_failed' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 20; fi;
        docker run --rm --entrypoint apache2ctl repository-web:rollback-runtime-snapshot -t >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1;
        apache_rc=$$?;
        echo "APACHE_CONFIG_EXIT_CODE=$$apache_rc" >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        if [ "$$apache_rc" -ne 0 ]; then echo 'ERROR=rollback_apache_config_failed' >> /bootstrap/tvsumare-runtime-rollback-build.txt; exit 21; fi;
        docker image inspect repository-web:rollback-runtime-snapshot --format 'ROLLBACK_IMAGE_ID={{.Id}}' >> /bootstrap/tvsumare-runtime-rollback-build.txt 2>&1;
        echo 'ROLLBACK_RUNTIME_DATA_EXCLUDED_BY_DOCKER_EXPORT=SIM' >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        echo 'ROLLBACK_RUNTIME_SECRETS_VALIDATED=SIM' >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        echo 'ROLLBACK_RUNTIME_BACKUPS_SANITIZED=SIM' >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        echo 'RESULT=rollback_image_ready' >> /bootstrap/tvsumare-runtime-rollback-build.txt;
        echo 'TVSUMARE_RUNTIME_ROLLBACK_BUILD=END' >> /bootstrap/tvsumare-runtime-rollback-build.txt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/projects/vitrine-vps-ops/repository/storage/app/factory/vps-ops:/bootstrap:rw

  vps_ops_tvsumare_safe_deployer:
    image: docker:27-cli
    container_name: vitrine_vps_ops_tvsumare_safe_deployer
    restart: "no"
    working_dir: /srv/tvsumare/repository
    depends_on:
      vps_ops_tvsumare_repository_builder:
        condition: service_completed_successfully
      vps_ops_tvsumare_runtime_rollback_builder:
        condition: service_completed_successfully
    command:
      - sh
      - /usr/local/bin/tvsumare-safe-deploy.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/tvsumare/repository:/srv/tvsumare/repository:ro
      - /srv/projects/vitrine-vps-ops/repository/vps-ops-plugin/tvsumare-safe-deploy.sh:/usr/local/bin/tvsumare-safe-deploy.sh:ro
      - /srv/projects/vitrine-vps-ops/repository/storage/app/factory/vps-ops:/bootstrap:rw

networks:
  vitrine_net:
    external: true
    name: vitrine_net
