services:
  vps_ops_plugin:
    build:
      context: .
      dockerfile: vps-ops-plugin/Dockerfile
    container_name: vitrine_vps_ops_plugin_hml
    restart: unless-stopped
    environment:
      OPS_API_URL: http://vitrine_ops_api_hml:8080
      OPS_BROKER_URL: http://host.docker.internal:8770
      OPS_BROKER_TOKEN: ${OPS_BROKER_TOKEN}
      OPS_REQUEST_TIMEOUT_MS: 120000
      HOST: 0.0.0.0
      PORT: 8181
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vitrine_net
    ports:
      - "127.0.0.1:18181:8181"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  vps_ops_query_bridge:
    build:
      context: .
      dockerfile: vps-ops-plugin/Dockerfile.bootstrap-tunnel
    container_name: vitrine_vps_ops_query_bridge
    restart: unless-stopped
    depends_on:
      vps_ops_plugin:
        condition: service_healthy
    environment:
      OPS_BROKER_TOKEN: ${OPS_BROKER_TOKEN}
    command:
      - /usr/local/bin/query-bridge.sh
    networks:
      - vitrine_net
    volumes:
      - /srv/projects/vitrine-vps-ops/repository/storage/app/factory/vps-ops:/bootstrap:rw

  vps_ops_bootstrap_tunnel:
    build:
      context: .
      dockerfile: vps-ops-plugin/Dockerfile.bootstrap-tunnel
    container_name: vitrine_vps_ops_bootstrap_tunnel
    restart: unless-stopped
    depends_on:
      vps_ops_plugin:
        condition: service_healthy
    environment:
      OPS_BROKER_TOKEN: ${OPS_BROKER_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - >-
        echo BOOTSTRAP_START > /bootstrap/tunnel.txt;
        curl -sS -i http://vitrine_ops_api_hml:8080/health > /bootstrap/ops-api.txt 2>&1 || true;
        curl -sS -H "Authorization: Bearer $${OPS_BROKER_TOKEN}" http://vitrine_ops_api_hml:8080/projects/tvsumare/git-inspect > /bootstrap/git-inspect.txt 2>&1 || true;
        curl -sS -X POST -H "Authorization: Bearer $${OPS_BROKER_TOKEN}" -H "Content-Type: application/json" --data '{"project_id":"tvsumare","expected_head":"41309f1a20205d6225e8b52995a8884be6cf16e7","expected_remote_head":"7137f53170370bae5b70c3d0bf84b89d5ccfcc34","recovery_ref":"recovery-local/tvsumare-prealign-20260815-41309f1","confirm":"EXECUTAR"}' http://vitrine_ops_api_hml:8080/projects/git-align > /bootstrap/align-result.txt 2>&1 || true;
        curl -sS -H "Authorization: Bearer $${OPS_BROKER_TOKEN}" http://vitrine_ops_api_hml:8080/projects/tvsumare/git-inspect > /bootstrap/git-inspect-after.txt 2>&1 || true;
        curl -sS -i -H "Authorization: Bearer $${OPS_BROKER_TOKEN}" http://host.docker.internal:8770/tvsumare/health > /bootstrap/ops-broker.txt 2>&1 || true;
        curl -sS -X POST -H "Authorization: Bearer $${OPS_BROKER_TOKEN}" http://host.docker.internal:8770/tvsumare/docker/build > /bootstrap/tvsumare-broker-build.json 2>&1 || true;
        cloudflared --version >> /bootstrap/tunnel.txt 2>&1;
        echo TUNNEL_START >> /bootstrap/tunnel.txt;
        cloudflared tunnel --no-autoupdate --loglevel info --url http://vps_ops_plugin:8181 >> /bootstrap/tunnel.txt 2>&1;
        echo TUNNEL_EXIT=$? >> /bootstrap/tunnel.txt;
        sleep 3600
    networks:
      - vitrine_net
    volumes:
      - /srv/projects/vitrine-vps-ops/repository/storage/app/factory/vps-ops:/bootstrap:rw

  vps_ops_tvsumare_runtime_inspector:
    image: docker:27-cli
    container_name: vitrine_vps_ops_tvsumare_runtime_inspector
    restart: "no"
    command:
      - sh
      - -lc
      - >-
        {
          echo 'TVSUMARE_RUNTIME_INSPECT=START';
          date -u '+AT=%Y-%m-%dT%H:%M:%SZ';
          echo '--- PS ---';
          docker ps -a --no-trunc --filter 'name=^/tvsumare_web$';
          echo '--- INSPECT ---';
          docker inspect tvsumare_web;
          echo '--- NETWORKS ---';
          docker inspect tvsumare_web --format '{{json .NetworkSettings.Networks}}';
          echo '--- MOUNTS ---';
          docker inspect tvsumare_web --format '{{json .Mounts}}';
          echo 'TVSUMARE_RUNTIME_INSPECT=END';
        } > /bootstrap/runtime-container-inspect.txt 2>&1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/projects/vitrine-vps-ops/repository/storage/app/factory/vps-ops:/bootstrap:rw

networks:
  vitrine_net:
    external: true
    name: vitrine_net
