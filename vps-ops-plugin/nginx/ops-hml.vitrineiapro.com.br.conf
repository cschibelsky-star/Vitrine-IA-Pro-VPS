server {
    listen 80;
    listen [::]:80;
    server_name ops-hml.vitrineiapro.com.br;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ops-hml.vitrineiapro.com.br;

    ssl_certificate /etc/letsencrypt/live/ops-hml.vitrineiapro.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops-hml.vitrineiapro.com.br/privkey.pem;

    client_max_body_size 2M;

    location = /health {
        proxy_pass http://vitrine_vps_ops_plugin_hml:8181/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /mcp {
        proxy_pass http://vitrine_vps_ops_plugin_hml:8181/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
