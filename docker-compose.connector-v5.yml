services:
  connector_v5:
    build:
      context: .
      dockerfile: connector-v5/Dockerfile
    container_name: vitrine_mcp_v5
    command: ["python", "/app/main_ext.py"]
    environment:
      PROJECT_MANIFEST_ROOT: /app/project-manifests
      PROJECT_WORKSPACE_ROOTS: /srv/projects,/srv/tvsumare
      PROJECT_MAX_READ_BYTES: 200000
      PROJECT_PHP_RUNNER_IMAGE: vitrine-core-hml-app:latest
      OPS_AUDIT_LOG: /var/log/vitrine-ops-v5/audit.jsonl
    volumes:
      - /srv/connectors/vitrine-vps-mcp/project-manifests:/app/project-manifests:rw
      - /srv/projects:/srv/projects:rw
      - /srv/tvsumare:/srv/tvsumare:rw
      - /srv/vitrine/docker/nginx/conf.d:/srv/vitrine/docker/nginx/conf.d:rw
      - /srv/vitrine/docker/nginx/html:/srv/vitrine/docker/nginx/html:rw
      - /srv/vitrine/ssl:/srv/vitrine/ssl:rw
      - /srv/vitrine/backups:/srv/vitrine/backups:rw
      - /var/log/vitrine-ops-v5:/var/log/vitrine-ops-v5:rw
      - /root/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8867:8000"
    networks:
      - vitrine_net
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-traefik_app_network"
      - "traefik.http.routers.mcp-v5.rule=Host(`mcp-v5.vitrineiapro.com.br`)"
      - "traefik.http.routers.mcp-v5.entrypoints=websecure"
      - "traefik.http.routers.mcp-v5.tls=true"
      - "traefik.http.routers.mcp-v5.tls.certresolver=le"
      - "traefik.http.services.mcp-v5.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

networks:
  vitrine_net:
    external: true
    name: vitrine_net
  traefik_net:
    external: true
    name: n8n-traefik_app_network
