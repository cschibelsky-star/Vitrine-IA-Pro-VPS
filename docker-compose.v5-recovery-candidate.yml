services:
  connector_v5_recovery_candidate:
    build:
      context: .
      dockerfile: connector-v5/Dockerfile
    container_name: vitrine_mcp_v5_recovery_candidate
    command: ["python", "/app/main_ext.py"]
    environment:
      PROJECT_MANIFEST_ROOT: /app/project-manifests
      PROJECT_WORKSPACE_ROOTS: /srv/projects,/srv/tvsumare
      PROJECT_MAX_READ_BYTES: 200000
      PROJECT_PHP_RUNNER_IMAGE: vitrine-core-hml-app:latest
      OPS_AUDIT_LOG: /var/log/vitrine-ops-v5-recovery/audit.jsonl
    volumes:
      - /srv/connectors/vitrine-vps-mcp/project-manifests:/app/project-manifests:ro
      - /srv/projects:/srv/projects:ro
      - /srv/tvsumare:/srv/tvsumare:ro
      - /var/log/vitrine-ops-v5-recovery:/var/log/vitrine-ops-v5-recovery:rw
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:18867:8000"
    networks:
      - vitrine_net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: "no"

networks:
  vitrine_net:
    external: true
    name: vitrine_net
