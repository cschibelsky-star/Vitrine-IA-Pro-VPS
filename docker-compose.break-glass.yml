services:
  break_glass_executor:
    build:
      context: .
      dockerfile: break-glass/Dockerfile.executor
    image: vitrine-break-glass-executor:0.1
    container_name: vitrine_break_glass_executor
    environment:
      BREAK_GLASS_EXECUTOR_SOCKET: /run/break-glass/executor.sock
      BREAK_GLASS_SOCKET_GID: "8871"
      BREAK_GLASS_EXECUTOR_AUDIT_LOG: /var/log/vitrine-break-glass/executor-audit.jsonl
      BREAK_GLASS_DATA_DIR: /var/lib/vitrine-break-glass
      BREAK_GLASS_V5_CONTAINER: vitrine_mcp_v5
      BREAK_GLASS_MAX_LOG_LINES: "500"
      BREAK_GLASS_KNOWN_GOOD_TAG: vitrine-mcp-v5:break-glass-known-good
      BREAK_GLASS_V5_COMPOSE_FILE: /srv/connectors/vitrine-vps-mcp/docker-compose.connector-v5.yml
      BREAK_GLASS_V5_DOCKER_PROJECT: vitrine-mcp-v5-v59
    volumes:
      - /run/break-glass:/run/break-glass:rw
      - /var/log/vitrine-break-glass:/var/log/vitrine-break-glass:rw
      - /var/lib/vitrine-break-glass:/var/lib/vitrine-break-glass:rw
      - /srv/connectors/vitrine-vps-mcp:/srv/connectors/vitrine-vps-mcp:ro
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  break_glass_api:
    build:
      context: .
      dockerfile: break-glass/Dockerfile
    image: vitrine-break-glass-api:0.1
    container_name: vitrine_break_glass_api
    environment:
      BREAK_GLASS_HOST: 127.0.0.1
      BREAK_GLASS_PORT: "8871"
      BREAK_GLASS_TOKEN_FILE: /var/lib/vitrine-break-glass/token
      BREAK_GLASS_EXECUTOR_SOCKET: /run/break-glass/executor.sock
      BREAK_GLASS_AUDIT_LOG: /var/log/vitrine-break-glass/api-audit.jsonl
      BREAK_GLASS_MAX_LOG_LINES: "500"
      BREAK_GLASS_RATE_WINDOW: "60"
      BREAK_GLASS_RATE_MAX: "20"
    group_add:
      - "8871"
    volumes:
      - /run/break-glass:/run/break-glass:rw
      - /var/log/vitrine-break-glass:/var/log/vitrine-break-glass:rw
      - /var/lib/vitrine-break-glass:/var/lib/vitrine-break-glass:rw
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - break_glass_executor
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8871/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  break_glass_watchdog:
    build:
      context: .
      dockerfile: break-glass/Dockerfile.watchdog
    image: vitrine-break-glass-watchdog:0.1
    container_name: vitrine_break_glass_watchdog
    environment:
      BREAK_GLASS_WATCH_TARGET: http://127.0.0.1:8867/
      BREAK_GLASS_EXECUTOR_SOCKET: /run/break-glass/executor.sock
      BREAK_GLASS_WATCH_STATE: /var/lib/vitrine-break-glass/watchdog.json
      BREAK_GLASS_WATCH_AUDIT: /var/log/vitrine-break-glass/watchdog.jsonl
      BREAK_GLASS_FAIL_THRESHOLD: "3"
      BREAK_GLASS_WATCH_INTERVAL: "30"
      BREAK_GLASS_COOLDOWN: "300"
      BREAK_GLASS_AUTO_ROLLBACK_RELEASE: ""
    group_add:
      - "8871"
    volumes:
      - /run/break-glass:/run/break-glass:rw
      - /var/log/vitrine-break-glass:/var/log/vitrine-break-glass:rw
      - /var/lib/vitrine-break-glass:/var/lib/vitrine-break-glass:rw
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.20
    depends_on:
      - break_glass_executor
    restart: unless-stopped
