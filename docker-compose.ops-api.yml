services:
  vitrine_ops_api:
    profiles: ["ops-api"]
    build:
      context: .
      dockerfile: ops-api/Dockerfile
    container_name: vitrine_ops_api_hml
    environment:
      PROJECT_MANIFEST_ROOT: /app/project-manifests
      PROJECT_WORKSPACE_ROOTS: /srv/tvsumare,/srv/projects
      PROJECT_MANAGER_TIMEOUT: 1200
      OPS_AUDIT_LOG: /var/log/vitrine-ops/audit.jsonl
      OPS_BROKER_TOKEN: ${OPS_BROKER_TOKEN}
      VITRINE_OPS_API_VERSION: 0.1.0
      HOSTGATOR_SSH_HOST: ${HOSTGATOR_SSH_HOST:-}
      HOSTGATOR_SSH_USER: ${HOSTGATOR_SSH_USER:-}
      HOSTGATOR_SSH_PORT: ${HOSTGATOR_SSH_PORT:-2222}
      HOSTGATOR_SSH_KEY_FILE: /run/secrets/hostgator_ops_key
      HOSTGATOR_HOME_ROOT: ${HOSTGATOR_HOME_ROOT:-/home1/cris1649}
      HOSTGATOR_ALLOWED_ROOTS: ${HOSTGATOR_ALLOWED_ROOTS:-public_html,vitrine-ai-pro,factory.vitrineaipro.com.br,conhecasumare.com.br}
      HOSTGATOR_OPS_TIMEOUT: ${HOSTGATOR_OPS_TIMEOUT:-60}
    volumes:
      - /srv/projects:/srv/projects:rw
      - /srv/tvsumare:/srv/tvsumare:rw
      - /var/log/vitrine-ops:/var/log/vitrine-ops:rw
    secrets:
      - hostgator_ops_key
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - vitrine_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  connector_self_update_install:
    image: alpine/git:2.47.2
    working_dir: /tmp
    volumes:
      - /srv/connectors/vitrine-vps-mcp:/runtime:rw
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        apk add --no-cache python3;
        git clone --depth 1 --branch feature/v4-hostgator-remote-ops https://github.com/cschibelsky-star/Vitrine-IA-Pro-VPS.git /tmp/source;
        CONNECTOR_ROOT=/runtime python3 /tmp/source/connector-v2/install_connector_v2.py;
        CONNECTOR_ROOT=/runtime python3 /tmp/source/connector-v2/install_hostgator_remote_ops.py;
        CONNECTOR_ROOT=/runtime python3 /tmp/source/project-manager/install_project_manager.py;
        CONNECTOR_ROOT=/runtime python3 /tmp/source/project-manager/recover_mcp_main.py;
        echo CONNECTOR_SELF_UPDATE_INSTALL_OK
    restart: "no"

  connector_self_update_rebuild:
    image: docker:27-cli
    depends_on:
      connector_self_update_install:
        condition: service_completed_successfully
    working_dir: /runtime
    volumes:
      - /srv/connectors/vitrine-vps-mcp:/runtime:rw
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - >-
        set -eu;
        docker compose -p vitrine-vps-mcp
        -f /runtime/docker-compose.mcp.yml
        -f /runtime/docker-compose.connector-v2.override.yml
        config >/tmp/connector-compose.yml;
        docker compose -p vitrine-vps-mcp
        -f /runtime/docker-compose.mcp.yml
        -f /runtime/docker-compose.connector-v2.override.yml
        up -d --build ops_broker vps_mcp_connector;
        echo CONNECTOR_SELF_UPDATE_REBUILD_OK
    restart: "no"

secrets:
  hostgator_ops_key:
    file: ${HOSTGATOR_SSH_KEY_PATH:-/srv/secrets/hostgator_ops_key}

networks:
  vitrine_net:
    external: true
    name: vitrine_net
