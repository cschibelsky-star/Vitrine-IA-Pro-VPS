name: ai-work-delegate-offline

on:
  push:
    branches:
      - feature/ai-work-delegate-v05-offline-hml-20261104
  pull_request:
    paths:
      - 'connector-v5/ai_*'
      - 'connector-v5/test_ai_*'
      - 'guard-stage-20261010/**'
      - '.github/workflows/ai-work-delegate-offline.yml'

permissions:
  contents: read

jobs:
  candidate-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FastMCP candidate dependencies
        run: python -m pip install -r connector-v5/requirements.txt
      - name: Validate code syntax
        run: python -m py_compile connector-v5/ai_work_delegate_candidate.py connector-v5/ai_delegate_v05_offline_broker.py guard-stage-20261010/via_code_overlay_entrypoint.py guard-stage-20261010/via_code_mcp_probe.py
      - name: Execute all delegation candidate tests including FastMCP handshake
        env:
          AI_DELEGATE_MODE: disabled
        run: |
          PYTHONPATH=connector-v5 python -m unittest -v             connector-v5/test_ai_work_delegate_candidate.py             connector-v5/test_ai_delegate_v05_offline_broker.py
