name: VIA backup restore offline tests
on:
  pull_request:
    paths:
      - 'connector-v2/via_backup_restore.py'
      - 'connector-v2/via_backup_operations.py'
      - 'connector-v2/test_via_backup_restore.py'
      - '.github/workflows/via-backup-restore-ci.yml'
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile connector-v2/via_backup_restore.py connector-v2/via_backup_operations.py connector-v2/test_via_backup_restore.py
      - name: Offline restore tests
        run: cd connector-v2 && python -m unittest -v test_via_backup_restore
