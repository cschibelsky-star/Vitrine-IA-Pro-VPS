name: Orchestrator Policy Routing Tests
on:
  push:
    branches:
      - fix/orquestrador-policy-routing-20261020
  pull_request:
    paths:
      - 'super-connector/foundation/orchestration.py'
      - 'super-connector/foundation/test_orchestration.py'
      - '.github/workflows/orchestrator-routing-tests.yml'
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test routing without external side effects
        run: python -m unittest discover -s super-connector/foundation -p test_orchestration.py -v
