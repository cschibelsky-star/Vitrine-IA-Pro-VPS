name: Super V2 runner proof
on:
  push:
    branches: [feat/super-v2-executor-operational-20261126]
    paths: ['.github/workflows/super-v2-runner-proof.yml']
permissions: {}
jobs:
  proof:
    runs-on: super-v2-hml
    timeout-minutes: 3
    steps:
      - name: Verify runner identity and isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = superv2runner
          python3 - <<'PY'
          import os, socket
          for path in ['/srv/projects', '/opt/super-v2-identity', '/run/super-v2-host']:
              assert not os.access(path, os.R_OK | os.X_OK), path
          with socket.socket(socket.AF_UNIX) as s:
              try:
                  s.connect('/run/docker.sock')
              except OSError:
                  pass
              else:
                  raise RuntimeError('Docker accessible')
          print('SUPER_V2_REMOTE_RUNNER_PROOF_OK')
          PY
