name: V5 VIA-CODE-01 read-only diagnostic

on:
  pull_request:
    paths:
      - 'connector-v5/via_code_pilot_tool.py'
      - 'connector-v5/test_via_code_pilot_tool.py'
      - '.github/workflows/v5-via-code-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax validation
        run: python -m py_compile connector-v5/via_code_pilot_tool.py connector-v5/test_via_code_pilot_tool.py
      - name: Offline tests - no Docker or paid API
        run: |
          cd connector-v5
          python -m unittest -v test_via_code_pilot_tool.py
