name: HeyGen runtime inventory
on:
  pull_request:
    paths:
      - 'connector-v2/*heygen*'
      - 'connector-v2/tvsumare_operations.py'
      - 'connector-v2/main_tvsumare_tools.py'
      - '.github/workflows/heygen-runtime-inventory.yml'
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_heygen_runtime_audit.py
        working-directory: connector-v2
      - run: python -m py_compile connector-v2/heygen_runtime_audit.py connector-v2/tvsumare_operations.py connector-v2/main_tvsumare_tools.py
