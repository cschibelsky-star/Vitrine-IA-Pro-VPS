name: V5 recovery candidate isolation

on:
  pull_request:
    paths:
      - 'docker-compose.v5-recovery-candidate.yml'
      - '.github/workflows/v5-recovery-candidate-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate Compose and isolation invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import json
          path = Path('docker-compose.v5-recovery-candidate.yml')
          text = path.read_text()
          assert '/var/run/docker.sock' not in text, 'Host Docker socket is forbidden'
          result = subprocess.run(['docker', 'compose', '-f', str(path), 'config', '--format', 'json'], capture_output=True, text=True)
          assert result.returncode == 0, result.stderr
          config = json.loads(result.stdout)
          services = config['services']
          assert set(services) == {'connector_v5_recovery_candidate'}, services.keys()
          candidate = services['connector_v5_recovery_candidate']
          assert candidate.get('restart') == 'no', candidate.get('restart')
          for mount in candidate.get('volumes', []):
              assert mount.get('read_only') or mount.get('target') == '/var/log/vitrine-ops-v5-recovery', mount
              assert mount.get('source') != '/var/run/docker.sock', mount
          ports = candidate.get('ports', [])
          assert len(ports) == 1 and ports[0].get('host_ip') == '127.0.0.1' and ports[0].get('published') == '18867', ports
          print('Static candidate isolation checks passed; no container started')
          PY
      - name: Build recovery candidate image without starting it
        run: docker build -f connector-v5/Dockerfile -t v5-recovery-candidate:ci .
      - name: Smoke test MCP startup without host Docker access
        run: |
          set -eu
          docker run -d --name v5-candidate-ci --network none --restart no v5-recovery-candidate:ci
          trap 'docker logs v5-candidate-ci || true; docker rm -f v5-candidate-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if ! test "$(docker inspect -f '{{.State.Running}}' v5-candidate-ci)" = true; then
              echo 'Candidate exited before MCP startup'
              exit 1
            fi
            if docker exec v5-candidate-ci python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"; then
              break
            fi
            if test "$i" -eq 30; then
              echo 'MCP did not listen on port 8000'
              exit 1
            fi
            sleep 2
          done
          docker exec v5-candidate-ci python -c "from pathlib import Path; assert not Path('/var/run/docker.sock').exists(), 'Unexpected Docker socket'; print('MCP listening; Docker socket absent')"
