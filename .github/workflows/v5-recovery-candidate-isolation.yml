name: V5 recovery candidate isolation

on:
  pull_request:
    paths:
      - 'docker-compose.v5-recovery-candidate.yml'
      - '.github/workflows/v5-recovery-candidate-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate Compose and isolation invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import json
          path = Path('docker-compose.v5-recovery-candidate.yml')
          text = path.read_text()
          assert '/var/run/docker.sock' not in text, 'Host Docker socket is forbidden'
          result = subprocess.run(['docker', 'compose', '-f', str(path), 'config', '--format', 'json'], capture_output=True, text=True)
          assert result.returncode == 0, result.stderr
          config = json.loads(result.stdout)
          services = config['services']
          assert set(services) == {'connector_v5_recovery_candidate'}, services.keys()
          candidate = services['connector_v5_recovery_candidate']
          assert candidate.get('restart') == 'no', candidate.get('restart')
          assert candidate.get('read_only') is True, 'Root filesystem must be read-only'
          assert 'ALL' in candidate.get('cap_drop', []), 'Capabilities must be dropped'
          assert any('no-new-privileges' in str(opt) for opt in candidate.get('security_opt', [])), 'No-new-privileges required'
          assert len(candidate.get('networks', {})) == 1, 'Candidate must have a dedicated network'
          network_name = next(iter(candidate['networks']))
          assert config['networks'][network_name].get('internal') is True, 'Network must be internal'
          assert not config['networks'][network_name].get('external'), 'External network forbidden'
          for mount in candidate.get('volumes', []):
              assert mount.get('read_only') or mount.get('target') == '/var/log/vitrine-ops-v5-recovery', mount
              assert mount.get('source') != '/var/run/docker.sock', mount
          ports = candidate.get('ports', [])
          assert len(ports) == 1 and ports[0].get('host_ip') == '127.0.0.1' and ports[0].get('published') == '18867', ports
          print('Static candidate isolation checks passed; no container started')
          PY
      - name: Validate actual Compose runtime hardening on CI runner
        run: |
          set -eu
          # Use CI-local fixtures, never production host paths or credentials.
          mkdir -p /srv/connectors/vitrine-vps-mcp/project-manifests /srv/projects /srv/tvsumare /var/log/vitrine-ops-v5-recovery
          docker compose -f docker-compose.v5-recovery-candidate.yml -p v5-recovery-ci config --quiet
          docker compose -f docker-compose.v5-recovery-candidate.yml -p v5-recovery-ci up -d --build --no-deps connector_v5_recovery_candidate
          trap 'docker compose -f docker-compose.v5-recovery-candidate.yml -p v5-recovery-ci down --remove-orphans || true' EXIT
          cid="$(docker compose -f docker-compose.v5-recovery-candidate.yml -p v5-recovery-ci ps -q connector_v5_recovery_candidate)"
          test -n "$cid"
          docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$cid" | grep -Fx true
          docker inspect -f '{{.HostConfig.SecurityOpt}}' "$cid" | grep -F no-new-privileges
          docker inspect -f '{{.HostConfig.CapDrop}}' "$cid" | grep -F ALL
          docker inspect -f '{{.HostConfig.NetworkMode}}' "$cid" | grep -F v5-recovery-ci
          if docker exec "$cid" test -S /var/run/docker.sock; then echo 'Unexpected Docker socket'; exit 1; fi
          for i in $(seq 1 30); do
            if docker exec "$cid" python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()" >/dev/null 2>&1; then break; fi
            if test "$i" -eq 30; then docker logs "$cid"; exit 1; fi
            sleep 2
          done
          echo 'Real Compose runtime hardening and MCP readiness passed on isolated CI fixtures'

      - name: Build recovery candidate image without starting it
        run: docker build -f connector-v5/Dockerfile -t v5-recovery-candidate:ci .
      - name: Smoke test MCP startup without host Docker access
        run: |
          set -eu
          docker run -d --name v5-candidate-ci --network none --restart no v5-recovery-candidate:ci
          trap 'docker logs v5-candidate-ci || true; docker rm -f v5-candidate-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if ! test "$(docker inspect -f '{{.State.Running}}' v5-candidate-ci)" = true; then
              echo 'Candidate exited before MCP startup'
              exit 1
            fi
            if docker exec v5-candidate-ci python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"; then
              break
            fi
            if test "$i" -eq 30; then
              echo 'MCP did not listen on port 8000'
              exit 1
            fi
            sleep 2
          done
          docker exec v5-candidate-ci python -c "from pathlib import Path; assert not Path('/var/run/docker.sock').exists(), 'Unexpected Docker socket'; print('MCP listening; Docker socket absent')"
          # Negative test: Docker CLI is installed but cannot control the host daemon.
          if docker exec v5-candidate-ci docker info >/dev/null 2>&1; then
            echo 'SECURITY FAILURE: candidate unexpectedly reached Docker daemon'
            exit 1
          fi
          echo 'Negative test passed: candidate cannot reach Docker daemon'
          # Verify network namespace is isolated from the runner.
          docker inspect -f '{{.HostConfig.NetworkMode}}' v5-candidate-ci | grep -Fx none

      - name: Verify MCP protocol and read-only health tool
        run: |
          docker run -d --name v5-mcp-protocol-ci --network none --restart no v5-recovery-candidate:ci
          trap 'docker logs v5-mcp-protocol-ci || true; docker rm -f v5-mcp-protocol-ci >/dev/null 2>&1 || true' EXIT
          # Wait for the HTTP listener; process creation is not readiness.
          for i in $(seq 1 30); do
            if ! test "$(docker inspect -f '{{.State.Running}}' v5-mcp-protocol-ci)" = true; then
              echo 'MCP candidate exited before readiness'
              exit 1
            fi
            if docker exec v5-mcp-protocol-ci python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()" >/dev/null 2>&1; then
              break
            fi
            if test "$i" -eq 30; then
              echo 'MCP candidate did not become ready'
              exit 1
            fi
            sleep 2
          done
          docker exec -i v5-mcp-protocol-ci python - <<'PY'
          import asyncio
          from fastmcp import Client

          async def verify():
              async with Client('http://127.0.0.1:8000/mcp', timeout=30) as client:
                  tools = await client.list_tools()
                  names = {tool.name for tool in tools}
                  assert 'connector_health' in names, 'connector_health missing from MCP registry'
                  result = await client.call_tool('connector_health', {})
                  assert not result.is_error, f'MCP health tool returned error: {result}'
                  print('MCP protocol connected; connector_health tool succeeded')

          asyncio.run(verify())
          PY

      - name: Verify read-only missing manifest and mutation confirmation gate
        run: |
          set -eu
          docker run -d --name v5-policy-ci --network none --restart no v5-recovery-candidate:ci
          trap 'docker logs v5-policy-ci || true; docker rm -f v5-policy-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec v5-policy-ci python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()" >/dev/null 2>&1; then break; fi
            if test "$i" -eq 30; then echo 'MCP readiness timed out'; exit 1; fi
            sleep 2
          done
          docker exec -i v5-policy-ci python - <<'PY'
          import asyncio
          import json
          from fastmcp import Client

          def payload(result):
              data = getattr(result, 'data', None)
              if isinstance(data, dict):
                  return data
              for item in result.content:
                  if getattr(item, 'type', None) == 'text':
                      try:
                          value = json.loads(item.text)
                          if isinstance(value, dict):
                              return value
                      except ValueError:
                          pass
              raise AssertionError(f'No dictionary response: {result}')

          async def verify():
              async with Client('http://127.0.0.1:8000/mcp', timeout=30) as client:
                  missing = payload(await client.call_tool('project_manifest', {'project_id': 'nonexistent-ci-fixture'}))
                  assert missing.get('ok') is False and missing.get('error') == 'manifest_not_found', missing
                  denied = payload(await client.call_tool('project_manifest_create', {
                      'project_id': 'nonexistent-ci-fixture',
                      'name': 'CI denied mutation',
                      'workspace_root': '/srv/projects/ci-fixture',
                      'repository_url': 'https://github.com/example/ci-fixture.git',
                      'confirm': '',
                  }))
                  assert denied.get('ok') is False and denied.get('error') == 'confirmation_required', denied
                  again = payload(await client.call_tool('project_manifest', {'project_id': 'nonexistent-ci-fixture'}))
                  assert again.get('error') == 'manifest_not_found', again
                  print('MCP read-only missing manifest and unauthorized mutation rejection verified')

          asyncio.run(verify())
          PY
