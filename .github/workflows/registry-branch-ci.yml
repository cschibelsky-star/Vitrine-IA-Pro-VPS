name: Registry branch validation

on:
  pull_request:
    paths:
      - 'connector-v5/**'
      - 'guard-stage-20261010/via_code*'
      - 'guard-stage-20261010/Dockerfile.via-code-overlay'
      - 'ops/v5_via_code_bootstrap.sh'
      - '.github/workflows/registry-branch-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared connector dependencies
        run: python -m pip install -r connector-v5/requirements.txt
      - name: Validate isolated logic and real MCP registration
        shell: bash
        run: |
          export PROJECT_MANIFEST_ROOT="$RUNNER_TEMP/registry-manifests"
          export OPS_AUDIT_LOG="$RUNNER_TEMP/registry-audit.jsonl"
          export PROJECT_WORKSPACE_ROOTS="$RUNNER_TEMP/registry-workspaces"
          python -m unittest discover -s connector-v5 -p 'test_*.py' -v
      - name: Validate one-time bootstrap shell syntax (no execution)
        run: bash -n ops/v5_via_code_bootstrap.sh
