name: Registry branch validation

on:
  pull_request:
    paths:
      - 'connector-v5/**'
      - '.github/workflows/registry-branch-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_MANIFEST_ROOT: ${{ runner.temp }}/registry-manifests
      OPS_AUDIT_LOG: ${{ runner.temp }}/registry-audit.jsonl
      PROJECT_WORKSPACE_ROOTS: ${{ runner.temp }}/registry-workspaces
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared connector dependencies
        run: python -m pip install -r connector-v5/requirements.txt
      - name: Validate isolated logic and real MCP registration
        run: python -m unittest discover -s connector-v5 -p 'test_*.py' -v
