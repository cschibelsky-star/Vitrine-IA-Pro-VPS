name: V5 Recovery 0.5.13 Gate

on:
  push:
    branches:
      - recovery/v5-0.5.13-from-snapshot-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastmcp psutil httpx pytest
      - name: Compile recovered V5 sources
        run: |
          python -m py_compile connector-v5/main.py connector-v5/main_ext.py connector-v5/marketing_live_patch.py connector-v5/controlled_operations_patch.py
      - name: Run recovered patch gate
        working-directory: connector-v5
        run: |
          pytest -q test_controlled_operations_patch.py
