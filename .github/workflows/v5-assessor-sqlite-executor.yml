name: V5 Assessor SQLite executor tests
on:
  push:
    branches:
      - fix/v5-assessor-sqlite-backup-executor-20261023
    paths:
      - 'connector-v5/assessor_sqlite_*.py'
      - 'connector-v5/main_ext.py'
      - 'connector-v5/Dockerfile'
      - '.github/workflows/v5-assessor-sqlite-executor.yml'
  workflow_dispatch:
jobs:
  isolated-backup-restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Test backup, recovery, corruption rejection
        run: python3 connector-v5/test_assessor_sqlite_backup.py
      - name: Compile executor modules
        run: python3 -m py_compile connector-v5/assessor_sqlite_backup.py connector-v5/assessor_sqlite_executor_patch.py connector-v5/assessor_sqlite_volume_helper.py
