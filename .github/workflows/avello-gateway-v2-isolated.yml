name: Avello Gateway V2 isolated offline validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/github-actions-dispatch-guard-isolated-20261114
    paths:
      - integrations/avello-gateway-v2/**
      - .github/workflows/avello-gateway-v2-isolated.yml

permissions:
  contents: read

concurrency:
  group: avello-v2-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-mcp:
    name: Offline Python MCP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AVELLO_V2_API_KEY: ""
      AVELLO_V2_MCP_BEARER_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: integrations/avello-gateway-v2/requirements-test.txt
      - name: Install reviewed test dependency
        run: python -m pip install -r integrations/avello-gateway-v2/requirements-test.txt
      - name: Report runtime version without secrets
        run: |
          python --version
          python -m pip show mcp | grep -E '^(Name|Version):'
      - name: Run offline unit tests (no provider calls)
        run: python -m unittest discover -s integrations/avello-gateway-v2/tests -v
      - name: Verify MCP tool registry without HTTP exposure
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "integrations/avello-gateway-v2")
          import server
          import asyncio
          tools = asyncio.run(server.mcp.list_tools())
          names = sorted(t.name for t in tools)
          assert names == ["gateway_models", "gateway_status"], names
          print("MCP tool registry: verified (2 read-only tools)")
          PY
