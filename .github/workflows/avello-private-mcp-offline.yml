name: Avello MCP offline checks
on:
  pull_request:
    paths:
      - integrations/avello-private-mcp/**
      - .github/workflows/avello-private-mcp-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/avello-private-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install HTTP test dependencies
        run: python -m pip install pytest httpx
      - name: Syntax
        run: python -m compileall -q server.py bridge.py tests
      - name: Offline tests
        env:
          AVELLO_CALLS_ENABLED: "false"
        run: python -m unittest discover -s tests -v
      - name: HTTP-level MCP auth and discovery
        env:
          AVELLO_CALLS_ENABLED: "false"
        run: python -m pytest -q tests/test_mcp_runtime.py
      - name: Import smoke
        env:
          AVELLO_CALLS_ENABLED: "false"
        run: python -c 'import server; assert server.avello_status()["calls_enabled"] is False; assert server.avello_ask("teste")["status"] == "blocked"'
