name: Superconector V2 private HML integration checks
on:
  push:
    branches:
      - feature/super-v2-private-executor-integration-20261117
    paths:
      - "superconector-v2/experiments/executor/**"
      - ".github/workflows/super-v2-private-executor-integration.yml"
  pull_request:
    paths:
      - "superconector-v2/experiments/executor/**"
      - ".github/workflows/super-v2-private-executor-integration.yml"
permissions:
  contents: read
jobs:
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install private API dependencies
        run: python -m pip install -r superconector-v2/experiments/executor/requirements-private.txt
      - name: Exercise Linux subprocess and private API authorization
        run: python -m unittest discover -s superconector-v2/experiments/executor -p "test_*.py" -v
      - name: Validate private compose syntax
        run: docker compose -f superconector-v2/experiments/executor/docker-compose.private-hml.yml config -q
      - name: Build isolated private executor (no deployment)
        run: docker build -f superconector-v2/experiments/executor/Dockerfile.private -t super-v2-private-hml:test .
