name: Deploy Cockpit Escritório HML

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA esperado da branch feature/escritorio-dev-eco-mvp-missoes-20261117"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cockpit through Ops API
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check Ops API
        shell: bash
        run: curl -fsS --max-time 15 http://127.0.0.1:18080/health >/dev/null
      - name: Reconcile and deploy Cockpit HML
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i vitrine_ops_api_hml sh -c 'set -a; . /run/secrets/ops.env; set +a; python3 -' <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8080"
          token = os.environ.get("OPS_BROKER_TOKEN", "")
          if not token:
              raise SystemExit("Ops API runtime credential is unavailable")
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def request(label, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method="GET" if data is None else "POST")
              try:
                  with urllib.request.urlopen(req, timeout=1200) as response:
                      result = json.load(response)
              except (urllib.error.URLError, TimeoutError) as exc:
                  raise SystemExit(f"{label} request failed: {type(exc).__name__}") from exc
              print(f"{label}: ok={result.get('ok')}")
              if not result.get("ok"):
                  raise SystemExit(f"{label} failed: {result.get('error') or result.get('stage') or 'operation_failed'}")
              return result

          request("manifest", "/projects/cockpit-escritorio-hml/manifest")
          request("clone", "/projects/clone", {"project_id": "cockpit-escritorio-hml"})
          request("status", "/projects/cockpit-escritorio-hml/status")
          request("deploy", "/project-deployments/deploy", {
              "project_id": "cockpit-escritorio-hml",
              "environment": "homologation",
              "update_repository": True,
              "build": True,
              "start": True,
          })
          PY
