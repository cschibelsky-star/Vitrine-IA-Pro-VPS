name: Deploy Cockpit Escritório HML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cockpit through VPS Ops
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/super-centro-operacional-v0.1
          fetch-depth: 1
      - name: Check Ops API
        shell: bash
        run: curl -fsS --max-time 15 http://127.0.0.1:18080/health >/dev/null
      - name: Ensure VPS Ops plugin
        shell: bash
        run: |
          set -euo pipefail
          find /srv/connectors/vitrine-vps-mcp/secrets/ops.env -maxdepth 2 -type f -printf '%p\n' 2>/dev/null || true
          set -a
          . /srv/connectors/vitrine-vps-mcp/secrets/ops.env
          set +a
          docker compose -p vitrine-vps-ops -f "$GITHUB_WORKSPACE/docker-compose.vps-ops.yml" up -d --build vps_ops_plugin
      - name: Reconcile and deploy Cockpit HML
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i vitrine_vps_ops_plugin_hml node - <<'NODE'
          const api = (process.env.OPS_API_URL || 'http://vitrine_ops_api_hml:8080').replace(/\/$/, '');
          const token = process.env.OPS_BROKER_TOKEN || '';
          if (!token) throw new Error('VPS Ops runtime credential unavailable');
          async function call(label, path, payload) {
            const response = await fetch(api + path, {
              method: payload ? 'POST' : 'GET',
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: payload ? JSON.stringify(payload) : undefined,
              signal: AbortSignal.timeout(1200000),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.ok === false) {
              const detail = body.result || body.detail || {};
              const stderr = String(detail.stderr || body.detail?.stderr || '');
              const reason = /local changes|would be overwritten/i.test(stderr) ? 'local_changes_block_checkout'
                : /untracked working tree/i.test(stderr) ? 'untracked_files_block_checkout'
                : /pathspec .* did not match/i.test(stderr) ? 'target_branch_missing_locally'
                : /permission denied|access denied/i.test(stderr) ? 'repository_permission_denied'
                : /authentication failed|could not read from remote|repository not found/i.test(stderr) ? 'repository_fetch_or_auth_failed'
                : 'unclassified_operation_failure';
              const steps = Array.isArray(detail.steps) ? detail.steps.map(step => ({stage: step.stage, ok: step.result?.ok, exit_code: step.result?.exit_code})) : undefined;
              console.log(`${label}: ${JSON.stringify({status: response.status, ok: body.ok, operation: body.operation, stage: body.stage || detail.stage, error: body.error || detail.error, reason, exit_code: detail.exit_code, steps})}`);
              throw new Error(`${label} failed`);
            }
            console.log(`${label}: ok=true`);
          }
          await call('manifest', '/projects/cockpit-escritorio-hml/manifest');
          await call('status', '/projects/cockpit-escritorio-hml/status');
          await call('clone', '/projects/clone', { project_id: 'cockpit-escritorio-hml' });
          await call('deploy', '/project-deployments/deploy', {
            project_id: 'cockpit-escritorio-hml',
            environment: 'homologation',
            update_repository: true,
            build: true,
            start: true,
          });
          NODE
