name: Deploy Cockpit Escritório HML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cockpit through VPS Ops
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check Ops API
        shell: bash
        run: curl -fsS --max-time 15 http://127.0.0.1:18080/health >/dev/null
      - name: Ensure VPS Ops plugin
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/projects/vitrine-vps-ops/repository
          docker compose -p vitrine-vps-ops -f docker-compose.vps-ops.yml up -d --build vps_ops_plugin
      - name: Reconcile and deploy Cockpit HML
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i vitrine_vps_ops_plugin_hml node - <<'NODE'
          const api = (process.env.OPS_API_URL || 'http://vitrine_ops_api_hml:8080').replace(/\/$/, '');
          const token = process.env.OPS_BROKER_TOKEN || '';
          if (!token) throw new Error('VPS Ops runtime credential unavailable');
          async function call(label, path, payload) {
            const response = await fetch(api + path, {
              method: payload ? 'POST' : 'GET',
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: payload ? JSON.stringify(payload) : undefined,
              signal: AbortSignal.timeout(1200000),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.ok === false) {
              throw new Error(`${label} failed: HTTP ${response.status} ${body.error || body.stage || 'operation_failed'}`);
            }
            console.log(`${label}: ok=true`);
          }
          await call('manifest', '/projects/cockpit-escritorio-hml/manifest');
          await call('clone', '/projects/clone', { project_id: 'cockpit-escritorio-hml' });
          await call('status', '/projects/cockpit-escritorio-hml/status');
          await call('deploy', '/project-deployments/deploy', {
            project_id: 'cockpit-escritorio-hml',
            environment: 'homologation',
            update_repository: true,
            build: true,
            start: true,
          });
          NODE
