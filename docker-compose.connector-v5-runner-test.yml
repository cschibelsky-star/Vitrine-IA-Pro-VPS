services:
  connector_v5_runner_test:
    build:
      context: .
      dockerfile: connector-v5/Dockerfile
    image: vitrine-mcp-v5-php-runner-test-v59:local
    container_name: vitrine_mcp_v5_php_runner_test_v59
    environment:
      PROJECT_MANIFEST_ROOT: /app/project-manifests
      PROJECT_WORKSPACE_ROOTS: /srv/projects,/srv/tvsumare
      PROJECT_MAX_READ_BYTES: "200000"
      PROJECT_PHP_RUNNER_IMAGE: vitrine-core-hml-app:latest
      OPS_AUDIT_LOG: /var/log/vitrine-ops-v5/audit.jsonl
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /srv/connectors/vitrine-vps-mcp/project-manifests:/app/project-manifests:ro
      - /srv/projects:/srv/projects:ro
      - /srv/tvsumare:/srv/tvsumare:ro
      - /srv/projects/vitrine-vps-mcp-test/logs:/var/log/vitrine-ops-v5:rw
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8869:8000"
    network_mode: bridge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: "no"

  php_validation_smoke:
    image: vitrine-mcp-v5-php-runner-test-v59:local
    container_name: vitrine_mcp_v5_php_validation_smoke_v59
    command:
      - python
      - -c
      - |
        import json
        import pathlib
        import sys
        import time
        import traceback
        output = pathlib.Path("/results/php-runner-smoke.json")
        try:
            import main
            tool = main.project_php_validate
            invoke = (
                getattr(tool, "fn", None)
                or getattr(tool, "function", None)
                or getattr(tool, "_fn", None)
            )
            if invoke is None:
                raise RuntimeError("function_tool_callable_missing:" + ",".join(sorted(dir(tool))))
            results = {
                operation: invoke("vitrine-marketing-agents-core-hml", operation)
                for operation in ("tests_marketing", "migrate_pretend")
            }
            payload = json.dumps(results, ensure_ascii=False, indent=2)
            ok = all(result.get("ok") for result in results.values())
        except BaseException as exc:
            payload = json.dumps({
                "ok": False,
                "exception": type(exc).__name__,
                "detail": str(exc),
                "traceback": traceback.format_exc(),
            }, ensure_ascii=False, indent=2)
            ok = False
        output.write_text(payload + "\n", encoding="utf-8")
        print(payload, flush=True)
        if not ok:
            sys.exit(1)
        pathlib.Path("/tmp/validation-ok").write_text("ok\n", encoding="utf-8")
        time.sleep(3600)
    environment:
      PROJECT_MANIFEST_ROOT: /app/project-manifests
      PROJECT_WORKSPACE_ROOTS: /srv/projects,/srv/tvsumare
      PROJECT_PHP_RUNNER_IMAGE: vitrine-core-hml-app:latest
      OPS_AUDIT_LOG: /tmp/audit.jsonl
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /srv/connectors/vitrine-vps-mcp/project-manifests:/app/project-manifests:ro
      - /srv/projects:/srv/projects:ro
      - /srv/tvsumare:/srv/tvsumare:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./validation-output:/results:rw
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/validation-ok"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
