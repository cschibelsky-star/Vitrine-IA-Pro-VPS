services:
  vps_backup:
    image: alpine:3.20
    container_name: vitrine_vps_backup
    command: ["/bin/sh", "/app/vps-backup.sh"]
    environment:
      BACKUP_ROOT: /backup
      RETENTION_DAYS: "14"
      INTERVAL_SECONDS: "86400"
      SOURCE_ROOT: /source
    volumes:
      - /:/source:ro
      - /srv/backups/vps:/backup:rw
      - ./vps-backup.sh:/app/vps-backup.sh:ro
    restart: unless-stopped
