services:
  vps_backup:
    image: rclone/rclone:latest
    container_name: vitrine_vps_backup
    entrypoint: ["/bin/sh"]
    command: ["/app/vps-backup.sh"]
    environment:
      STAGING_ROOT: /staging
      REMOTE_ROOT: "vitrine-drive-crypt:Vitrine-IA-Pro/Backups/VPS"
      INTERVAL_SECONDS: "86400"
      SOURCE_ROOT: /source
    volumes:
      - /:/source:ro
      - /srv/vitrine/backups/staging:/staging:rw
      - /root/.config/rclone:/config/rclone:rw
      - ./vps-backup.sh:/app/vps-backup.sh:ro
    restart: unless-stopped