services:
  install_project_manager_v2:
    image: python:3.12-alpine
    container_name: vitrine_connector_bootstrap_v2
    working_dir: /repo
    command: ["python", "/repo/project-manager/install_project_manager.py"]
    volumes:
      - /srv/projects/vitrine-ia-pro-vps/repository:/repo:ro
      - /srv/connectors/vitrine-vps-mcp:/srv/connectors/vitrine-vps-mcp:rw

  reload_connector_v2:
    image: docker:27-cli
    container_name: vitrine_connector_reload_v2
    working_dir: /connector
    depends_on:
      install_project_manager_v2:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/connectors/vitrine-vps-mcp:/connector:rw
    command:
      - sh
      - -lc
      - |
        set -eu
        if [ -f /connector/docker-compose.yml ]; then BASE=/connector/docker-compose.yml; elif [ -f /connector/compose.yml ]; then BASE=/connector/compose.yml; else echo 'BASE_COMPOSE_NOT_FOUND'; ls -la /connector; exit 2; fi
        if [ -f /connector/docker-compose.connector-v2.override.yml ]; then
          docker compose -f "$BASE" -f /connector/docker-compose.connector-v2.override.yml up -d --build ops_broker vps_mcp_connector
        else
          docker compose -f "$BASE" up -d --build ops_broker vps_mcp_connector
        fi
